# Fallback when Railway uses Railpack instead of Dockerfile.
[phases.setup]
aptPkgs = ["ffmpeg", "libgomp1"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-mms.txt",
  "python -c \"import sentencepiece; import torch; from transformers import AutoTokenizer, VitsModel; AutoTokenizer.from_pretrained('facebook/mms-tts-aka', use_fast=False); print('MMS tokenizer OK', torch.__version__)\"",
]
