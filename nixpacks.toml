# Fallback when Railway uses Railpack instead of Dockerfile.
[phases.setup]
aptPkgs = ["ffmpeg", "libgomp1"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-mms.txt",
  "python -c \"import torch; from transformers import VitsModel; print('MMS deps OK', torch.__version__)\"",
]
