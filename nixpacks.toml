# LEGACY (Railway Railpack fallback). The API now targets Vercel serverless.
# MMS (torch/transformers) was removed; TTS extras are optional (offline use).
[phases.setup]
aptPkgs = ["ffmpeg"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip install -r requirements-tts.txt",
]
