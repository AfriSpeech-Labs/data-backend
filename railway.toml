# LEGACY — the API now deploys to Vercel (see vercel.json). Kept for reference.
# Railway: API service with Root Directory = `backend`.
# Build via Dockerfile (Python 3.12 + ffmpeg; MMS/torch removed).
# Env vars: MONGODB_URI, CORS_ORIGINS, ADMIN_*, R2_*, HF_TOKEN, REQUIRE_R2=true.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python run.py"
